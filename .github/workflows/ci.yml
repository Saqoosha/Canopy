name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes; the token is only used to fetch (actions/checkout
# and actions/setup-node both take it). Without this block both jobs
# would inherit whatever the repository default is.
permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs, but never a push to main — otherwise two
  # merges in quick succession leave the first commit on main with no
  # completed CI run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shim-tests:
    name: vscode-shim unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials: false — neither job runs git against THIS repo
      # after checkout (SwiftPM does clone Sparkle, but into its own
      # working copy), so there is no reason to leave the token in
      # .git/config where a later step or a cached artifact could pick it up.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Pure-logic tests over the shim modules: every filesystem path is
      # passed in by the test (mkdtemp under os.tmpdir()), never defaulted
      # by the module, so they need neither macOS nor the CC extension.
      # Keep it that way and this job can stay on ubuntu.
      #
      # test/shim-integration.test.js deliberately is NOT run here: it
      # spawns the real extension.js from ~/.vscode/extensions, which no
      # runner has.
      - name: Run shim unit tests
        run: node --test test/shim-unit.test.js

  logic-probe:
    name: Swift logic probe
    # macos-26 because macos-15 DEFAULTS to Xcode 16.4, under which this
    # codebase does not compile at all: ~20 errors, all but one about
    # actor isolation, spread across ShimProcess / CanopyApp /
    # WebViewContainer / ContentViewer / InputWidthProbe (that file list
    # is exact). They are not defects — the sites are callback and
    # nonisolated contexts that the newer toolchain accepts and the older
    # one rejects. Read the failing run for the actual list rather than
    # trusting a summary here; earlier attempts to characterise the set
    # in one sentence were wrong twice.
    #
    # Not the only fix available: the macos-15 image also carries Xcode 26
    # builds, so DEVELOPER_DIR / xcode-select would work too. This is the
    # simplest way to get a toolchain that compiles, not the required one.
    # Only two pairs have been built: Xcode 16.4 / Swift 6.1.2 fails (on
    # the runner), Xcode 26.6 / Swift 6.3.3 passes (runner and dev
    # machine). Nothing between has been tried.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Printed so a future image bump that moves the default Xcode is
      # diagnosable from the log rather than from 20 confusing errors.
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Sparkle is the only SPM dependency, and project.yml now pins it to
      # an exact version (issue #114), so this cache no longer decides
      # which Sparkle *version* resolves. It does still supply the bits:
      # Sparkle is a binaryTarget, and the cached directory holds both the
      # xcframework and the checksum that vouches for it, so a hit skips
      # the download where SwiftPM would verify it — a tampered cache
      # carries its own alibi. GitHub's cache scoping bounds who can write
      # one (a PR branch reads main's cache, never writes into it —
      # https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching),
      # and nothing else does; cache contents are not signed. Accepted,
      # because `-clonedSourcePackagesDirPath .spm-cache` appears only in
      # this job — no release script uses it, so this cache cannot reach a
      # shipped build.
      #
      # What it saves is the clone and the artifact download, not a pin:
      # the checkout carries no Package.resolved (that lives in the
      # gitignored Canopy.xcodeproj), so SwiftPM re-resolves against the
      # pbxproj requirement every run. Any project.yml edit misses the
      # exact key and falls through to restore-keys — and the key cannot
      # single out a Sparkle bump, since release.sh rewrites
      # MARKETING_VERSION in the same file on every release.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v6
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate

      # `-configuration Debug` is load-bearing, not just faster:
      # SidebarLogicProbe is `#if DEBUG`, so a Release build compiles the
      # probe out entirely and the app launches for real instead of
      # exiting. (Changing only this flag fails fast, because the next
      # step hardcodes Products/Debug; change both and you get five red
      # minutes at the step timeout with no hint of why.)
      #
      # Ad-hoc signing ("Sign to Run Locally") because CI has no keychain
      # holding the Developer ID identity project.yml pins for both Debug
      # and Release. CLAUDE.md sanctions ad-hoc for one-shot CI; the probe
      # exits inside applicationDidFinishLaunching before reaching any
      # TCC-gated path, so no folder grants are needed.
      #
      # That override means this job exercises a THIRD signing
      # configuration: project.yml pins Developer ID, scripts/
      # build_debug_stable.sh overrides to Apple Development +
      # sh.saqoo.Canopy.debug, and this overrides to ad-hoc while leaving
      # the project's default bundle id. A green run here says nothing
      # about whether build_debug_stable.sh or release.sh still sign
      # correctly.
      - name: Build (Debug, ad-hoc signed)
        run: |
          xcodebuild \
            -project Canopy.xcodeproj \
            -scheme Canopy \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/ci-derived \
            -clonedSourcePackagesDirPath .spm-cache \
            -quiet \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            build

      # The probe runs at applicationDidFinishLaunching and exits 0 when
      # every assertion passed, 1 when any failed — no window is ever
      # shown. Run the executable directly, not `open`, so the exit code
      # reaches the shell.
      - name: Run logic probe
        timeout-minutes: 5
        run: |
          CANOPY_RUN_LOGIC_PROBE=1 \
            ./build/ci-derived/Build/Products/Debug/Canopy.app/Contents/MacOS/Canopy
