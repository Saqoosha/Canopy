name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes; the token is only used to fetch (actions/checkout
# and actions/setup-node both take it). Without this block both jobs
# would inherit whatever the repository default is.
permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs, but never a push to main — otherwise two
  # merges in quick succession leave the first commit on main with no
  # completed CI run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shim-tests:
    name: vscode-shim unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials: false — neither job runs git against THIS repo
      # after checkout (SwiftPM does clone Sparkle, but into its own
      # working copy), so there is no reason to leave the token in
      # .git/config where a later step or a cached artifact could pick it up.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Pure-logic tests over the shim modules: every filesystem path is
      # passed in by the test (mkdtemp under os.tmpdir()), never defaulted
      # by the module, so they need neither macOS nor the CC extension.
      # Keep it that way and this job can stay on ubuntu.
      #
      # test/shim-integration.test.js deliberately is NOT run here: it
      # spawns the real extension.js from ~/.vscode/extensions, which no
      # runner has.
      #
      # Two reporters, because the exit code alone gates nothing: `node
      # --test` exits 0 over a file containing zero tests (measured on node
      # 20 — only a *missing* file exits 1), so emptying shim-unit.test.js,
      # or every `it()` becoming `it.skip()`, would pass. `spec` goes to the
      # log for humans; `tap` goes to a file because its `# pass N` summary
      # is plain ASCII and stable, unlike the spec reporter's `ℹ pass N`.
      # Only the top-level summary is unindented, so `^# pass ` cannot match
      # a subtest's.
      #
      # EXPECTED_TESTS is a floor, not an equality: adding tests never turns
      # this red, removing one always does. That is the intended trade — a
      # deliberate removal is supposed to cost an edit here. Keep it equal
      # to the current count rather than comfortably below it; slack is
      # exactly as many tests as can then disappear unnoticed.
      #
      # MAX_DURATION_MS catches a second exit-0 regression, measured during
      # PR #112: deleting the `timer.unref()` in the shim leaves a live
      # timer holding the event loop open, and the run goes from ~90 ms to
      # ~60 s while still exiting 0. The job's timeout-minutes sits far
      # above 60 s, so nothing notices. The ceiling is deliberately ~300x
      # the local runtime and still well under that 60 s signature — a
      # loaded runner cannot reach it, a leaked timer always does.
      - name: Run shim unit tests
        env:
          EXPECTED_TESTS: 101
          MAX_DURATION_MS: 30000
        run: |
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/tap.log" \
            test/shim-unit.test.js
          passed=$(sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/tap.log")
          if [ -z "$passed" ]; then
            echo "::error::node --test printed no TAP summary — the runner never finished. This is not a failing test; look above for a crash or a missing file."
            exit 1
          fi
          if [ "$passed" -lt "$EXPECTED_TESTS" ]; then
            echo "::error::only $passed tests passed, expected at least $EXPECTED_TESTS. If tests were removed on purpose, lower EXPECTED_TESTS in .github/workflows/ci.yml in the same commit."
            exit 1
          fi
          duration=$(sed -n 's/^# duration_ms \([0-9.]*\)$/\1/p' "$RUNNER_TEMP/tap.log")
          if ! awk -v d="$duration" -v max="$MAX_DURATION_MS" 'BEGIN { exit !(d > 0 && d < max) }'; then
            echo "::error::suite took ${duration}ms, ceiling ${MAX_DURATION_MS}ms — the tests themselves are fast, so this is the event loop being held open after they finish (a timer that lost its .unref())."
            exit 1
          fi
          echo "$passed tests passed in ${duration}ms (floor $EXPECTED_TESTS, ceiling ${MAX_DURATION_MS}ms)"

  logic-probe:
    name: Swift logic probe
    # macos-26 because macos-15 DEFAULTS to Xcode 16.4, under which this
    # codebase does not compile at all: ~20 errors, all but one about
    # actor isolation, spread across ShimProcess / CanopyApp /
    # WebViewContainer / ContentViewer / InputWidthProbe (that file list
    # is exact). They are not defects — the sites are callback and
    # nonisolated contexts that the newer toolchain accepts and the older
    # one rejects. Read the failing run for the actual list rather than
    # trusting a summary here; earlier attempts to characterise the set
    # in one sentence were wrong twice.
    #
    # Not the only fix available: the macos-15 image also carries Xcode 26
    # builds, so DEVELOPER_DIR / xcode-select would work too. This is the
    # simplest way to get a toolchain that compiles, not the required one.
    # Only two pairs have been built: Xcode 16.4 / Swift 6.1.2 fails (on
    # the runner), Xcode 26.6 / Swift 6.3.3 passes (runner and dev
    # machine). Nothing between has been tried.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Printed so a future image bump that moves the default Xcode is
      # diagnosable from the log rather than from 20 confusing errors.
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Sparkle is the only SPM dependency. project.yml records only its
      # *minimum* version (`from: 2.9.0`), and Package.resolved lives
      # inside the gitignored Canopy.xcodeproj, so nothing in the repo
      # pins the resolved version — this cache makes builds faster, not
      # reproducible. What it saves is the clone, not the resolution:
      # xcodegen regenerates the project every run, so SwiftPM resolves
      # every run regardless. restore-keys means an edited project.yml
      # still restores the previous checkout rather than re-cloning.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v6
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate

      # `-configuration Debug` is load-bearing, not just faster:
      # SidebarLogicProbe is `#if DEBUG`, so a Release build compiles the
      # probe out entirely and the app launches for real instead of
      # exiting. (Changing only this flag fails fast, because the next
      # step hardcodes Products/Debug; change both and you get five red
      # minutes at the step timeout with no hint of why.)
      #
      # Ad-hoc signing ("Sign to Run Locally") because CI has no keychain
      # holding the Developer ID identity project.yml pins for both Debug
      # and Release. CLAUDE.md sanctions ad-hoc for one-shot CI; the probe
      # exits inside applicationDidFinishLaunching before reaching any
      # TCC-gated path, so no folder grants are needed.
      #
      # That override means this job exercises a THIRD signing
      # configuration: project.yml pins Developer ID, scripts/
      # build_debug_stable.sh overrides to Apple Development +
      # sh.saqoo.Canopy.debug, and this overrides to ad-hoc while leaving
      # the project's default bundle id. A green run here says nothing
      # about whether build_debug_stable.sh or release.sh still sign
      # correctly.
      - name: Build (Debug, ad-hoc signed)
        run: |
          xcodebuild \
            -project Canopy.xcodeproj \
            -scheme Canopy \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/ci-derived \
            -clonedSourcePackagesDirPath .spm-cache \
            -quiet \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            build

      # The probe runs at applicationDidFinishLaunching and exits 0 when
      # every assertion passed, 1 when any failed — no window is ever
      # shown. Run the executable directly, not `open`, so the exit code
      # reaches the shell.
      #
      # The exit code alone is not a gate, for two separate reasons.
      # (1) runAllTests is one ~2000-line straight-line function, so a
      # future early `return`, a `#if` that excludes a block, or a merge
      # that drops a section all yield `failures == 0` → exit 0 → green
      # with a fraction of the assertions run. The floor below is what
      # makes "the context-meter block silently disappeared" red.
      # (2) exit 1 is ambiguous between "assertions failed" and "the app
      # never launched" (DEBUG not defined, WindowServer unavailable, a
      # crash before the probe). Checking for the summary line first
      # separates them, so the two do not read identically in the log.
      #
      # Floor semantics are the same as EXPECTED_TESTS on the shim job:
      # equal to the current count, adding assertions is always green,
      # removing one always costs an edit here.
      - name: Run logic probe
        timeout-minutes: 5
        env:
          EXPECTED_ASSERTIONS: 210
        run: |
          set -o pipefail
          status=0
          CANOPY_RUN_LOGIC_PROBE=1 \
            ./build/ci-derived/Build/Products/Debug/Canopy.app/Contents/MacOS/Canopy \
            2>&1 | tee "$RUNNER_TEMP/probe.log" || status=$?
          passed=$(sed -n 's/^--- \([0-9][0-9]*\) passed.*/\1/p' "$RUNNER_TEMP/probe.log")
          if [ -z "$passed" ]; then
            echo "::error::probe printed no summary line (exit $status) — it never reached the end of runAllTests. Not an assertion failure: look above for a launch failure or a crash."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::probe reported failing assertions (exit $status) — grep the log above for lines starting with '  FAIL '."
            exit "$status"
          fi
          if [ "$passed" -lt "$EXPECTED_ASSERTIONS" ]; then
            echo "::error::probe ran only $passed assertions, expected at least $EXPECTED_ASSERTIONS. If assertions were removed on purpose, lower EXPECTED_ASSERTIONS in .github/workflows/ci.yml in the same commit."
            exit 1
          fi
          echo "$passed assertions passed (floor $EXPECTED_ASSERTIONS)"
