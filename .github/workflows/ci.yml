name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes; the token is only used to fetch (actions/checkout
# and actions/setup-node both take it). Without this block both jobs
# would inherit whatever the repository default is.
permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs, but never a push to main — otherwise two
  # merges in quick succession leave the first commit on main with no
  # completed CI run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shim-tests:
    name: vscode-shim unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # These three lists classify every JS file under test/, and together they
    # are the job's single source of truth. They sit at job level because the
    # assert step needs all three and the run step needs CI_TEST_FILES — and
    # the point of that sharing is that "listed" and "run" cannot drift: the
    # assert step compares the UNION against disk, the run step passes
    # CI_TEST_FILES to `node --test`. The first revision hardcoded the run
    # list a second time, so listing a new file satisfied the gate without
    # running it — #119's own failure mode inside #119's fix.
    #
    # A file that should run goes in CI_TEST_FILES and therefore runs. A file
    # that must not run goes in EXCLUDED_TEST_FILES. A file under test/ that
    # is not a test at all goes in NON_TEST_FILES. Three visibly different
    # acts rather than one append that could mean any of them.
    env:
      CI_TEST_FILES: "test/shim-unit.test.js"
      EXCLUDED_TEST_FILES: "test/shim-integration.test.js"
      # Not a test: a harness, imported only by the integration suite — so
      # nothing this job runs touches it. Node WOULD still discover it (see
      # the assert step), which is why it has to be listed rather than left
      # looking like an oversight.
      NON_TEST_FILES: "test/helpers.js"
    steps:
      # persist-credentials: false — neither job runs git against THIS repo
      # after checkout (SwiftPM does clone Sparkle, but into its own
      # working copy), so there is no reason to leave the token in
      # .git/config where a later step or a cached artifact could pick it up.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # The "Run shim unit tests" step below runs exactly CI_TEST_FILES, so a
      # test file that reaches none of the three lists would never run, never
      # be counted, and never turn this red — `# pass N` stays where it was
      # and the floor is still met (issue #119). That is the #113 shape one
      # level up: the count floor watches the contents of the files it was
      # told about, not the suite.
      #
      # So assert the SET: every JS file under `test/` must appear in one of
      # the three lists. Adding one is then a decision, and — because the run
      # step is driven by CI_TEST_FILES — putting it in the run list is what
      # makes it run. There is no separate place to forget.
      #
      # The predicate is every `.js` / `.mjs` / `.cjs` under `test/`, and
      # that breadth is deliberate rather than lazy. Node's own discovery
      # includes `**/test/**/*.?(c|m)js` — every such file under a directory
      # named `test`, whatever it is called. The first revision listed
      # node's *name* patterns instead (`*.test.js`, `*-test.js`, …) and was
      # wrong twice over: it missed the `.mjs`/`.cjs` spellings of those
      # names, and it missed the directory rule entirely, so `test/foo.js`
      # and `test/unit/nested.js` were invisible to it while node would have
      # run both. Measured on node 20.18.1 locally and re-checked on 24, so
      # the rule outlives the runner moving off 20; `node-version: "20"`
      # resolves whatever 20.x the image carries, which is not pinned here.
      # Matching the directory rule also retires the obligation to track
      # node's naming conventions as they change.
      #
      # Not exactly node's set: node skips `node_modules`, this does not, so
      # the assertion is BROADER. That direction is safe — an extra file
      # turns the step red until someone classifies it — but "identical to
      # node's discovery" is not a property to carry forward.
      #
      # Three bounds it does NOT cover, stated because two earlier revisions
      # of this comment overclaimed and CLAUDE.md repeated the overclaim: it
      # looks only under `test/`, so a test colocated beside the module it
      # covers is invisible to it; it asserts which files EXIST, never that
      # a listed file still contains tests; and NON_TEST_FILES /
      # EXCLUDED_TEST_FILES are unverified claims, so a real test parked in
      # either is ungated exactly as before. That last one is why the error
      # message spells out what each list means. `find` failing — `test/`
      # missing — aborts the step under `-e` + `pipefail` rather than
      # yielding an empty set; measured, and the `pipefail` is what makes
      # that true rather than a silent `found=[]`.
      #
      # `-L` so a symlinked test is followed rather than skipped by
      # `-type f`: node's discovery follows it, so a gate that did not would
      # be a hole shaped exactly like the ones above.
      #
      # `set -f` is load-bearing, not tidiness. The list expansions below are
      # deliberately unquoted so they word-split, and unquoted expansion in
      # bash also globs — so a list written as `test/*.js` would expand
      # against the same tree `found` scanned, collapsing the comparison
      # toward `X == X`. Measured on today's flat tree: the gate passes with
      # an unlisted file present. That spelling is the one a future
      # maintainer is most likely to reach for, having just been told a glob
      # was considered. LC_ALL=C on both sorts so the comparison cannot hinge
      # on the runner's collation.
      - name: Assert the test file set
        run: |
          set -f -o pipefail
          found=$(find -L test -type f \
            \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) \
            | LC_ALL=C sort | tr '\n' ' ')
          # shellcheck disable=SC2086  # splitting the lists into words is the point
          expected=$(printf '%s\n' $CI_TEST_FILES $EXCLUDED_TEST_FILES $NON_TEST_FILES \
            | LC_ALL=C sort | tr '\n' ' ')
          if [ "$found" != "$expected" ]; then
            echo "::error::JS files under test/ are [$found], but CI_TEST_FILES + EXCLUDED_TEST_FILES + NON_TEST_FILES is [$expected]. A new test file is NOT run by CI just by existing. Put it in CI_TEST_FILES (job-level env, near the top of this file) and it runs and is counted. EXCLUDED_TEST_FILES is only for a suite that genuinely cannot run on ubuntu without the CC extension, like shim-integration.test.js. NON_TEST_FILES is only for something that is not a test at all, like a shared harness. Each is a different claim; none of them is a shortcut to green."
            exit 1
          fi
          echo "test file set matches: $found"

      # Pure-logic tests over the shim modules: every filesystem path is
      # passed in by the test (mkdtemp under os.tmpdir()), never defaulted
      # by the module, so they need neither macOS nor the CC extension.
      # Keep it that way and this job can stay on ubuntu.
      #
      # test/shim-integration.test.js deliberately is NOT run here: it
      # spawns the real extension.js from ~/.vscode/extensions, which no
      # runner has. That exclusion is expressed once, as EXCLUDED_TEST_FILES
      # at job level — this step runs CI_TEST_FILES and knows nothing about
      # what was left out.
      #
      # Two reporters, because the exit code alone gates nothing: `node
      # --test` exits 0 over a file containing zero tests (measured on node
      # 20 — only a *missing* file exits 1), so emptying shim-unit.test.js,
      # or every `it()` becoming `it.skip()`, would pass. `spec` goes to the
      # log for humans; `tap` goes to a file because its `# pass N` summary
      # is plain ASCII and stable, unlike the spec reporter's `ℹ pass N`.
      # Both counts are read as the LAST match, never the first, and that
      # is a correctness requirement rather than a style. The counts block
      # is the final thing the reporter emits, and everything a test writes
      # to stdout is captured and echoed BEFORE it with a `# ` prefix the
      # reporter adds itself. So one `console.log('pass 999')` anywhere in
      # the suite — no `#` needed, the reporter supplies it — puts a line
      # matching `^# pass [0-9]+$` ahead of the real one. Measured: a
      # first-match extractor reads 999 against a true count of 1, and the
      # same vector fakes `# duration_ms` low enough to disable the ceiling.
      # A false green in the check that exists to prevent false greens.
      #
      # (The reporter does escape a leading `#` the test itself writes —
      # `console.log('# pass 999')` arrives as `# \# pass 999`, and `spec`
      # does not escape it. Real, and a fair reason to read counts from
      # `tap` rather than `spec` alongside the ASCII stability, but it is
      # NOT a forgery guarantee: it only guards a spelling no forger needs.
      # An earlier revision of this comment claimed otherwise and picked
      # first-match on the strength of it.)
      #
      # Counts are extracted with `awk`, not `sed -n p`, and that
      # difference is load-bearing rather than stylistic too. `sed`
      # prints EVERY match, so a second matching line would make `passed`
      # multi-line — and `[ "$passed" -lt N ]` on a non-integer exits 2,
      # which `if` reads as false, skipping the error branch and letting
      # the step reach its final `echo` and exit 0. That is a false green
      # inside the very check that exists to prevent false greens. `awk`
      # keeping one value and printing it in `END` yields exactly one
      # digit-run or nothing, and nothing is already handled below — which
      # is why the extractor is written that way rather than with `exit`:
      # it has to pick the last match anyway, and that shape gives both
      # properties at once. Note this hardens only the LEFT operand: an
      # `EXPECTED_*` that was not a plain integer would fail open the same
      # way. It cannot be one today — both are literals a few lines up —
      # but that stops being true the moment either is sourced from a
      # `vars.*` expression. Rewriting the comparison in `awk` only half
      # helps: a non-numeric operand does then fail closed, but an EMPTY
      # one is not a strnum, so the compare goes lexical and lands open
      # again. Validate both operands explicitly if that day comes.
      #
      # EXPECTED_TESTS is a floor, not an equality: adding tests never turns
      # this red, removing one always does. That is the intended trade — a
      # deliberate removal is supposed to cost an edit here. Keep it equal
      # to the current count rather than comfortably below it; slack is
      # exactly as many tests as can then disappear unnoticed.
      #
      # A floor only ratchets when a human raises it, so slack accumulates
      # silently, and the drift `::warning::` below is what makes it visible
      # (issue #120). The probe job's floor comment carries the full account
      # — the measured accident, and why this warns instead of failing — and
      # is the copy to edit; the same story told twice in one file is how the
      # two copies came to contradict each other on when it happened.
      #
      # Worth stating once here because it is the ongoing cost rather than
      # the rationale: once slack exists the warning fires on EVERY later
      # run, on main and on unrelated PRs, until someone raises the number.
      # That persistence is the mechanism, not a side effect of it.
      #
      # MAX_DURATION_MS catches a second exit-0 regression, measured during
      # PR #112: deleting the `timer.unref()` in the shim leaves a live
      # timer holding the event loop open, and the run goes from ~90 ms to
      # ~60 s while still exiting 0. The job's timeout-minutes sits far
      # above 60 s, so nothing notices. That 60 s is not a coincidence — it
      # is `Resources/vscode-shim/notifications.js`'s own timeout constant,
      # so this ceiling only detects that leak while the constant stays
      # above it. Headroom, measured on the runner rather than estimated:
      # 174/189/193 ms across this PR's own runs, i.e. ~155–172x, with
      # ~10% run-to-run spread — a range, not a constant. Deliberately no
      # local figure: it depends on the developer's machine and node
      # version, and the runner is what actually has to clear the bar.
      # Against the leak the ceiling is half of 60 s, not "far below":
      # raising it much further would start eating into what it detects.
      - name: Run shim unit tests
        env:
          EXPECTED_TESTS: 101
          MAX_DURATION_MS: 30000
        run: |
          # `set -f` here for the same reason the assert step has it, and
          # because without it the two steps expand the SAME variable under
          # different rules — which is the only way "listed" and "run" could
          # still diverge. Measured: with a bracket-glob filename listed, the
          # assert step (globbing off) matched disk and went green while this
          # step (globbing on) expanded the entry to a different file and
          # never ran the listed one. Contrived filename, real divergence.
          #
          # Unquoted on purpose: CI_TEST_FILES is a space-separated list and
          # word-splitting it is how more than one file is ever passed.
          set -f
          # shellcheck disable=SC2086
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/tap.log" \
            $CI_TEST_FILES
          passed=$(awk '/^# pass [0-9]+$/ { v = $3 } END { if (v != "") print v }' "$RUNNER_TEMP/tap.log")
          if [ -z "$passed" ]; then
            echo "::error::no '# pass N' line in the TAP output. A failing or missing test file exits non-zero and the step's implicit 'bash -e' aborts before this line, so neither is the cause here: look for the reporter's summary format changing, or tap.log being written empty."
            exit 1
          fi
          if [ "$passed" -lt "$EXPECTED_TESTS" ]; then
            echo "::error::only $passed tests passed, expected at least $EXPECTED_TESTS. If tests were removed on purpose, lower EXPECTED_TESTS in .github/workflows/ci.yml in the same commit."
            exit 1
          fi
          if [ "$passed" -gt "$EXPECTED_TESTS" ]; then
            echo "::warning::EXPECTED_TESTS is $((passed - EXPECTED_TESTS)) below the actual count ($passed vs floor $EXPECTED_TESTS). Those tests are ungated — they can be deleted later and this job stays green. Raise EXPECTED_TESTS to $passed in .github/workflows/ci.yml. If this fires on a PR that added none, the gap came in via main (Actions builds the merge ref) — that is issue #120's exact accident, and $passed counts main plus this branch."
          fi
          duration=$(awk '/^# duration_ms [0-9.]+$/ { v = $3 } END { if (v != "") print v }' "$RUNNER_TEMP/tap.log")
          if ! awk -v d="$duration" -v max="$MAX_DURATION_MS" 'BEGIN { exit !(d > 0 && d < max) }'; then
            echo "::error::suite duration '${duration}' is not under ${MAX_DURATION_MS}ms. The suite runs in ~200ms on this runner today, so a large number here is almost certainly something holding the event loop open after the tests finish — a timer that lost its .unref() is the known case. If it is blank, the duration line could not be parsed."
            exit 1
          fi
          echo "$passed tests passed in ${duration}ms (floor $EXPECTED_TESTS, ceiling ${MAX_DURATION_MS}ms)"

  logic-probe:
    name: Swift logic probe
    # macos-26 because macos-15 DEFAULTS to Xcode 16.4, under which this
    # codebase does not compile at all: ~20 errors, all but one about
    # actor isolation, spread across ShimProcess / CanopyApp /
    # WebViewContainer / ContentViewer / InputWidthProbe (that file list
    # is exact). They are not defects — the sites are callback and
    # nonisolated contexts that the newer toolchain accepts and the older
    # one rejects. Read the failing run for the actual list rather than
    # trusting a summary here; earlier attempts to characterise the set
    # in one sentence were wrong twice.
    #
    # Not the only fix available: the macos-15 image also carries Xcode 26
    # builds, so DEVELOPER_DIR / xcode-select would work too. This is the
    # simplest way to get a toolchain that compiles, not the required one.
    # Only two pairs have been built: Xcode 16.4 / Swift 6.1.2 fails (on
    # the runner), Xcode 26.6 / Swift 6.3.3 passes (runner and dev
    # machine). Nothing between has been tried.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Printed so a future image bump that moves the default Xcode is
      # diagnosable from the log rather than from 20 confusing errors.
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Sparkle is the only SPM dependency, and project.yml now pins it to
      # an exact version (issue #114), so this cache no longer decides
      # which Sparkle *version* resolves. It does still supply the bits:
      # Sparkle is a binaryTarget, and the cached directory holds the
      # already-extracted xcframework. SwiftPM's checksum covers the
      # downloaded zip, which is gone after extraction, so a cache hit is
      # not a verification boundary at all — the bytes are simply trusted.
      # GitHub's cache scoping bounds who can write one (a PR branch reads
      # main's cache, never writes into it —
      # https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching),
      # and nothing else does; cache contents are not signed. Accepted,
      # because `-clonedSourcePackagesDirPath .spm-cache` appears only in
      # this job — no release script uses it, so this cache cannot reach a
      # shipped build.
      #
      # What it saves is the clone and the artifact download, not a pin:
      # the checkout carries no Package.resolved (that lives in the
      # gitignored Canopy.xcodeproj), so SwiftPM re-resolves against the
      # pbxproj requirement every run. Any project.yml edit misses the
      # exact key and falls through to restore-keys — and the key cannot
      # single out a Sparkle bump, since release.sh rewrites
      # MARKETING_VERSION in the same file on every release.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v6
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate

      # `-configuration Debug` is load-bearing, not just faster:
      # SidebarLogicProbe is `#if DEBUG`, so a Release build compiles the
      # probe out entirely and the app launches for real instead of
      # exiting. (Changing only this flag fails fast, because the next
      # step hardcodes Products/Debug; change both and you get five red
      # minutes at the step timeout with no hint of why.)
      #
      # Ad-hoc signing ("Sign to Run Locally") because CI has no keychain
      # holding the Developer ID identity project.yml pins for both Debug
      # and Release. CLAUDE.md sanctions ad-hoc for one-shot CI; the probe
      # exits inside applicationDidFinishLaunching before reaching any
      # TCC-gated path, so no folder grants are needed.
      #
      # That override means this job exercises a THIRD signing
      # configuration: project.yml pins Developer ID, scripts/
      # build_debug_stable.sh overrides to Apple Development, and this
      # overrides to ad-hoc. A green run here says nothing about whether
      # build_debug_stable.sh or release.sh still sign correctly.
      #
      # The bundle id is NOT part of that difference any more. It used to
      # be — this step left project.yml's default, so an ad-hoc build wore
      # sh.saqoo.Canopy. Harmless on an ephemeral runner, unwanted on a
      # developer's Mac, where reproducing this job registers a throwaway
      # build with LaunchServices under the shipped app's identity — the
      # measured harm project.yml's Debug comment records. (That comment
      # also records a stale TCC row and traces it to a pre-#74 Release.
      # This job is not a candidate either way: an ad-hoc signature is a
      # cdhash requirement, not the Developer ID leaf that row demands.
      # Don't read it as evidence about ad-hoc builds.) project.yml now pins
      # sh.saqoo.Canopy.debug for every Debug build made from a freshly
      # generated project, so no call site has to remember.
      - name: Build (Debug, ad-hoc signed)
        run: |
          xcodebuild \
            -project Canopy.xcodeproj \
            -scheme Canopy \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/ci-derived \
            -clonedSourcePackagesDirPath .spm-cache \
            -quiet \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            build

      # The probe runs at applicationDidFinishLaunching and exits 0 when
      # every assertion passed, 1 when any failed — no window is ever
      # shown. Run the executable directly, not `open`, so the exit code
      # reaches the shell.
      #
      # The exit code alone is not a gate, for two separate reasons.
      # (1) runAllTests is one ~2000-line function with no test registry —
      # a flat sequence of assertions rather than cases something iterates
      # over, so nothing notices when a stretch of it stops running. Thus a
      # future early `return`, a `#if` that excludes a block, or a merge
      # that drops a section all yield `failures == 0` → exit 0 → green
      # with a fraction of the assertions run. The floor below is what
      # makes "the context-meter block silently disappeared" red.
      # (2) a non-zero exit is ambiguous between "assertions failed" and
      # "the app never launched" (WindowServer unavailable, a crash before
      # the probe — which arrives as 128+signal, not 1, hence the checks
      # below test `-ne 0` rather than `-eq 1`). Checking for the summary
      # line first separates them, so the two do not read identically in
      # the log. Note this does NOT cover a
      # Release build: there the probe is compiled out, the app launches
      # for real and never exits, and the step dies at timeout-minutes
      # without reaching any of these checks — see the build step above.
      #
      # `2>&1` is load-bearing, not noise: the summary reaches this pipe
      # only via stderr (`FileHandle.standardError.write` in the probe).
      # There is a second copy — `logger.info` — but it goes to the unified
      # log, which is not piped. Dropping the redirect while tidying makes
      # every run fail with "no summary line", pointing at a launch failure
      # that did not happen.
      #
      # Floor semantics are the same as EXPECTED_TESTS on the shim job:
      # equal to the current count, adding assertions is always green,
      # removing one always costs an edit here.
      #
      # The cost of that asymmetry is real and was observed on #117 itself:
      # #115 merged nine of issue #108's assertions into main while that
      # branch was open, so the floor sat nine below actual and nine could
      # have gone missing unnoticed. Actions builds the merge ref, so the
      # gap opened with no edit, in nobody's PR, and surfaced only by
      # coincidence — a local-vs-CI count mismatch noticed for an unrelated
      # reason.
      #
      # #117 responded by asking humans here to raise the number in the same
      # commit. That request cannot reach the case that produced the gap:
      # #115 merged before this floor existed, and more generally a merge-ref
      # gap belongs to no PR, so there is no author it could be addressed to.
      # (It is not that the request was tried and failed — nothing between
      # #117 and this change added an assertion. The claim is about who the
      # request can reach, not about an observed violation of it.) So the
      # drift is now reported by the job instead (issue #120) — still a
      # `::warning::`, because "adding assertions is always green" is the
      # design and must not become a blocking edit. Raising it in the same
      # commit is still the right habit; it is just no longer the only
      # thing standing between slack and silence.
      #
      # Same reason for `awk` over
      # `sed -n p`, and LAST match rather than first — see that step's
      # comment, both points apply here for the same reasons. If anything
      # this stream needs it more: it is the app's raw merged stdout+stderr
      # with no reporter between, so any line at all could precede the
      # summary, while the summary is the last thing the probe writes
      # before `exit()`. One caveat on that: stdout is fully buffered when
      # piped, so a stdout write made BEFORE the stderr summary would be
      # flushed at `exit()` and land after it. Nothing in Sources/ writes
      # to stdout today — the probe reports via stderr and os_log — but
      # that, not write order, is what makes last-match safe here.
      - name: Run logic probe
        timeout-minutes: 5
        env:
          EXPECTED_ASSERTIONS: 432
        run: |
          set -o pipefail
          status=0
          CANOPY_RUN_LOGIC_PROBE=1 \
            ./build/ci-derived/Build/Products/Debug/Canopy.app/Contents/MacOS/Canopy \
            2>&1 | tee "$RUNNER_TEMP/probe.log" || status=$?
          passed=$(awk '/^--- [0-9]+ passed/ { v = $2 } END { if (v != "") print v }' "$RUNNER_TEMP/probe.log")
          if [ -z "$passed" ]; then
            echo "::error::no '--- N passed' line in the probe output (exit $status). Not a recorded assertion failure: either the probe never reached the end of runAllTests (look above for a launch failure, a tripped precondition, or a crash), or its summary format no longer matches this awk."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::probe exited $status after printing its summary — most likely failing assertions, so grep the log above for lines starting with '  FAIL '. If there are none, the probe was killed after writing the summary, or tee failed."
            exit "$status"
          fi
          if [ "$passed" -lt "$EXPECTED_ASSERTIONS" ]; then
            echo "::error::probe ran only $passed assertions, expected at least $EXPECTED_ASSERTIONS. If assertions were removed on purpose, lower EXPECTED_ASSERTIONS in .github/workflows/ci.yml in the same commit."
            exit 1
          fi
          if [ "$passed" -gt "$EXPECTED_ASSERTIONS" ]; then
            echo "::warning::EXPECTED_ASSERTIONS is $((passed - EXPECTED_ASSERTIONS)) below the actual count ($passed vs floor $EXPECTED_ASSERTIONS). Those assertions are ungated — they can be deleted later and this job stays green. Raise EXPECTED_ASSERTIONS to $passed in .github/workflows/ci.yml. If this fires on a PR that added none, the gap came in via main (Actions builds the merge ref) — that is issue #120's exact accident."
          fi
          echo "$passed assertions passed (floor $EXPECTED_ASSERTIONS)"
