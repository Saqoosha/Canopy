name: Canopy
options:
  bundleIdPrefix: sh.saqoo
  deploymentTarget:
    macOS: "15.0"
  minimumXcodeGenVersion: "2.42.0"

packages:
  # exactVersion, not `from:`. `Package.resolved` is written inside
  # `Canopy.xcodeproj/`, which is gitignored, so with an open range nothing
  # in the repo constrained a resolve or recorded what it picked. Sparkle
  # downloads and installs signed updates for the shipped app, so "which
  # build is this" needs an answer here. See issue #114.
  #
  # Two failure modes, both measured before this pin landed (2026-08-01).
  # Wherever a `Package.resolved` survived, the version FROZE: xcodegen
  # does not rewrite that file (checked on 2.46.0) and an existing pin
  # already satisfies a `from:` range, so the main checkout had been on
  # 2.9.1 since 2026-03-30 and every Canopy release through 2.10.3 shipped
  # it — straight past 2.9.2's security fixes. Wherever none existed — CI,
  # a fresh clone, a new worktree — the resolve floated to whatever 2.x was
  # newest, and then froze there in turn.
  #
  # `exactVersion` fixes a TAG, so an upstream retag would still change the
  # linked bits. `revision:` and committing `Package.resolved` each close
  # that and stay available (the latter needs a .gitignore carve-out git
  # can descend into).
  #
  # Bumps are manual: edit this line only — CLAUDE.md quotes a 2.9.2
  # security floor that is deliberately independent of the pin, so do not
  # raise it to match. Own commit, so the diff says which Sparkle a release
  # links. `xcodegen generate` writes the requirement into the pbxproj and
  # touches nothing outside it — notably not `Package.resolved`; SwiftPM
  # re-resolves on the next build.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

settings:
  base:
    MARKETING_VERSION: "2.24.0"
    CURRENT_PROJECT_VERSION: "104"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: VCFY2GFR89

targets:
  Canopy:
    type: application
    platform: macOS
    sources:
      - Sources/Canopy
      - path: Resources/vscode-shim
        type: folder
        buildPhase: resources
      - path: Resources/ssh-claude-wrapper.sh
        buildPhase: resources
      - path: Resources/prism.js
        buildPhase: resources
      - path: Resources/prism-canopy.css
        buildPhase: resources
      - path: Resources/canopy-overrides.css
        buildPhase: resources
    resources:
      - path: Sources/Canopy/Resources/Assets.xcassets
      - path: Sources/Canopy/theme-light.css
        buildPhase: resources
    dependencies:
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: Sources/Canopy/Canopy.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.personal-information.photos-library: true
        com.apple.security.personal-information.reminders: true
        com.apple.security.device.speech-recognition: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: sh.saqoo.Canopy
      SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          # Debug's own bundle id lives HERE, not only in
          # scripts/build_debug_stable.sh, so that no call site can forget
          # it. scripts/build.sh (Debug by default; it takes a configuration
          # argument), scripts/auto-adopt.sh and the CI job (plus anyone
          # reproducing it locally) all build Debug with no bundle-id
          # override, so each of them used to produce an app claiming the
          # SHIPPED id. Those three run `xcodegen generate` first, so the
          # pin reaches them immediately. An Xcode GUI build does NOT: it
          # uses whatever Canopy.xcodeproj was generated last, and that file
          # is gitignored — so that route picks the pin up only after the
          # next `xcodegen generate`.
          #
          # The measured harm, 2026-08-16 on one machine: seven
          # LaunchServices registrations for sh.saqoo.Canopy, six of them
          # worktree and scratchpad Debug builds. `lsregister` is not on
          # PATH; `-dump` lists them and `-u <path>` drops one. Full path:
          # /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          #
          # A stale TCC row for sh.saqoo.Canopy turned up in the same
          # session and is NOT evidence for this change — recorded here only
          # so the next person doesn't re-derive it. Its stored requirement
          # demanded a Developer ID leaf with OU=G5G54TCH8W, so tccd
          # answered every ScreenCapture and Accessibility check with
          # "Failed to match existing code requirement for subject
          # sh.saqoo.Canopy" and both grants read as not granted. Producing
          # that requirement takes a Developer ID leaf from that identity,
          # which is still valid in this keychain. The likely source is an
          # install built before cfc1dd2 (#74, 2026-05-29), which migrated
          # Release off "Developer ID Application: Whatever Co. (G5G54TCH8W)"
          # while Debug was still Apple Development — so no Debug build of
          # that era could have written it. A hand-signed build would also
          # do it. Recovery: `tccutil reset ScreenCapture sh.saqoo.Canopy`
          # (same for Accessibility), then re-grant.
          #
          # This retires the earlier "sign Debug with the same Developer ID
          # so one folder grant covers both builds" arrangement: the shared
          # grant was the whole point of matching identities, and separate
          # ids give it up deliberately. Two consequences, both real:
          #
          #   * The UserDefaults domain splits too. Those routes move onto
          #     the domain build_debug_stable.sh uses, so what they read on
          #     first launch depends on whether that script has ever run on
          #     the machine: if it has, they inherit ITS window frames,
          #     filters and Sparkle state rather than the Release build's;
          #     if it hasn't, the domain is new and they start empty. Either
          #     way nothing migrates from sh.saqoo.Canopy, and any `defaults
          #     write` aimed at a Debug build must now target
          #     sh.saqoo.Canopy.debug.
          #   * The TCC collision moves rather than ending. Debug and
          #     Release can no longer share a row — but build_debug_stable.sh
          #     signs Apple Development while this config pins Developer ID,
          #     so the two DEBUG routes now hold the same bundle id under
          #     different designated requirements and take turns invalidating
          #     each other's grants. Alternating between them re-prompts each
          #     time. Before the split, build.sh and auto-adopt.sh shared
          #     Release's row harmlessly, since they inherited its identity
          #     from this config; build_debug_stable.sh already carried its
          #     own id and its own row.
          #
          # Since no cert can put Debug and Release on one row any more,
          # CODE_SIGN_IDENTITY below could be any identity, and unifying it
          # with build_debug_stable.sh's would close the Debug-vs-Debug case
          # above. It is left as-is because choosing a Debug identity is its
          # own decision, not a side effect of this one. Do NOT delete the
          # line: nothing else supplies it (project-level `settings.base`
          # has no signing keys), so removing it changes how Debug is signed.
          PRODUCT_BUNDLE_IDENTIFIER: sh.saqoo.Canopy.debug
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: Tomohiko Koyama (VCFY2GFR89)"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: Tomohiko Koyama (VCFY2GFR89)"
    info:
      path: Sources/Canopy/Info.plist
      properties:
        CFBundleDisplayName: Canopy
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        SUFeedURL: "https://saqoosha.github.io/Canopy/appcast.xml"
        SUPublicEDKey: "CfVhssjAg+ilpn08nLc2CvEID3s0PorWOS4lwUBfGto="
        NSAppleEventsUsageDescription: "A program running within Canopy would like to use AppleScript."
        NSBluetoothAlwaysUsageDescription: "A program running within Canopy would like to use Bluetooth."
        NSCalendarsUsageDescription: "A program running within Canopy would like to access your Calendar."
        NSCameraUsageDescription: "A program running within Canopy would like to use the camera."
        NSContactsUsageDescription: "A program running within Canopy would like to access your Contacts."
        NSLocalNetworkUsageDescription: "A program running within Canopy would like to access the local network."
        NSLocationUsageDescription: "A program running within Canopy would like to access your location information."
        NSMicrophoneUsageDescription: "A program running within Canopy would like to use your microphone."
        NSMotionUsageDescription: "A program running within Canopy would like to access motion data."
        NSPhotoLibraryUsageDescription: "A program running within Canopy would like to access your Photo Library."
        NSRemindersUsageDescription: "A program running within Canopy would like to access your reminders."
        NSSpeechRecognitionUsageDescription: "A program running within Canopy would like to use speech recognition."
        NSSystemAdministrationUsageDescription: "A program running within Canopy requires elevated privileges."
